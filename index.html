  ["cards", "🃏 Flashcards", "词卡"],

const $ = id => document.getElementById(id);
const storageKey = "pipo-spanish-passport-v1";
const freshPassport = () => ({ units: {}, recordings: [], badges: [], voice: "", slow: false });
let passport = freshPassport();
let storageAvailable = true;

try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
  if (saved && typeof saved === "object") passport = { ...freshPassport(), ...saved };
} catch {
  storageAvailable = false;
}

let currentUnit = units[0];
let currentStep = "cards";
let disposePanel = () => {};
let voices = [];
let utterance;
const synth = window.speechSynthesis;
const lesson = $("lesson");

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(passport));
    storageAvailable = true;
  } catch {
    storageAvailable = false;
  }
  renderPassport();
}

function unitProgress(unit = currentUnit) {
  return passport.units[unit.id] ||= { cards: [], game: [], builder: [], listened: [] };
}

function complete(unit, step) {
  const done = passport.units[unit.id];
  const counts = { cards: unit.vocab.length, game: unit.vocab.length, builder: unit.questions.length };
  return Boolean(done && done[step]?.length >= counts[step]);
}

function earn(step, index, unit = currentUnit) {
  const seen = unitProgress(unit)[step];
  if (seen.includes(index)) return false;
  seen.push(index);
  save();
  return true;
}

// Stars derive from unique learning milestones and completed recordings.
function renderPassport() {
  const learningSteps = ["cards", "game", "builder"];
  const completed = units.reduce((total, unit) =>
    total + learningSteps.filter(step => complete(unit, step)).length, 0);
  const stars = units.reduce((total, unit) => {
    const record = passport.units[unit.id];
    return total + (record ? [...learningSteps, "listened"]
      .reduce((sum, step) => sum + (record[step]?.length || 0), 0) : 0);
  }, passport.recordings.length);
  const badges = [
    ["👂 Super ears · 顺风耳", units.some(unit => complete(unit, "game"))],
    ["🧱 Word builder · 造句达人", units.some(unit => complete(unit, "builder"))],
    ["🎬 Movie pup · 小小导演", passport.recordings.length > 0],
    ["🏅 Spanish explorer · 西语探险家", completed === units.length * 3]
  ];
  passport.badges = badges.filter(([, unlocked]) => unlocked).map(([label]) => label);
  $("stars").textContent = `⭐ ${stars} Stars · 星星`;
  $("progress").max = units.length * 3;
  $("progress").value = completed;
  const unitDone = units.filter(unit => learningSteps.every(step => complete(unit, step))).length;
  $("progress-text").textContent = `${completed}/${units.length * 3} steps · 学习步骤　${unitDone}/${units.length} units · 完成单元`;
  $("badges").replaceChildren();

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = label;
    $("badges").append(badge);
  }
  if (!passport.badges.length) $("badges").textContent = "Earn badges as you explore · 探险途中可以解锁徽章";
  $("passport-status").textContent = storageAvailable ? "" :
    "Progress is available for this visit only. · 当前浏览器暂时只能在本次打开期间保留进度。";
  updateNavigation();
}

function updateNavigation() {
  for (const button of $("units").children) {
    button.setAttribute("aria-pressed", String(button.dataset.unit === currentUnit.id));
    const unit = units.find(item => item.id === button.dataset.unit);
    button.querySelector(".unit-check").textContent =
      ["cards", "game", "builder"].every(step => complete(unit, step)) ? " ✓" : "";
  }
  for (const button of $("steps").children) {
    button.setAttribute("aria-pressed", String(button.dataset.step === currentStep));
    button.querySelector(".step-check").textContent = complete(currentUnit, button.dataset.step) ? " ✓" : "";
  }
}

function updateVoices() {
  const available = synth?.getVoices() || [];
  const preference = voice => {
    const lang = voice.lang.toLowerCase().replace("_", "-");
    return lang === "es-es" ? 0 : lang === "es-mx" ? 1 : 2;
  };
  voices = available.filter(voice => /^es(?:[-_]|$)/i.test(voice.lang))
    .sort((a, b) => preference(a) - preference(b));
  $("voice").replaceChildren(new Option("Auto · 自动选择", ""));
  for (const voice of voices) {
    $("voice").append(new Option(`${voice.name} (${voice.lang})`, voice.voiceURI));
  }
  $("voice").value = voices.some(voice => voice.voiceURI === passport.voice) ? passport.voice : "";
  $("voice").disabled = !voices.length;
  $("voice-status").textContent = !synth ?
    "Speech unavailable · 此浏览器不支持朗读" : !voices.length ?
    "Trying the system voice · 将尝试系统语音" : "";
}

function stopSpeech() {
  utterance = null;
  synth?.cancel();
}

function speak(text, onStart) {
  if (!synth || !window.SpeechSynthesisUtterance) {
    $("voice-status").textContent = "Speech unavailable · 此浏览器不支持朗读";
    return false;
  }
  stopSpeech();
  const next = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, ", ").replace(/…/g, ""));
  const voice = voices.find(item => item.voiceURI === $("voice").value) || voices[0];
  if (voice) next.voice = voice;
  next.lang = voice?.lang || "es-ES";
  next.rate = passport.slow ? 0.65 : 0.95;
  next.onstart = () => { if (utterance === next) onStart?.(); };
  next.onerror = event => {
    if (utterance === next && !["canceled", "interrupted"].includes(event.error)) {
      $("voice-status").textContent = "Voice could not play. Try another voice. · 朗读暂未播放，可试试切换语音。";
    }
  };
  utterance = next;
  try {
    synth.speak(next);
    return true;
  } catch {
    $("voice-status").textContent = "Voice could not play. · 暂时无法朗读。";
    return false;
  }
}

function syncSpeed() {
  $("speed").setAttribute("aria-pressed", String(passport.slow));
  $("speed").textContent = passport.slow ? "🐌 Slow speed on · 慢速已开启" : "🐌 Snail speed · 蜗牛慢速";
}

function shuffle(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function button(label, action, className = "") {
  const element = document.createElement("button");
  element.type = "button";
  element.textContent = label;
  element.className = className;
  element.addEventListener("click", action);
  return element;
}

  updateNavigation();

     songs: songs, studio: videoStudio })[step](currentUnit);

}

// Step 1: a card counts as reviewed after the learner flips it.
function flashcards(unit) {

  if (index < 0) index = 0;

        <span class="face back" aria-hidden="true">

  const card = lesson.querySelector(".flash");

    const [es, en, zh, icon, example, tip] = unit.vocab[index];

    back.querySelector(".translation").textContent = `${en} · ${zh}`;
    back.querySelector(".example").textContent = example;

// Step 2: every word appears exactly once per round. Text clues keep the
// same answer choices playable when a Spanish voice is unavailable.
function listeningGame(unit) {
  lesson.innerHTML = `
    <h2 id="activity-title" tabindex="-1">🎧 Listening game · 听音辨词</h2>
    <p>Listen to Spanish. Choose the matching meaning. · 听西语，选出对应的词义。</p>
    <div class="row">
      <button id="game-listen" type="button" class="primary">🔊 Play word · 播放词语</button>
      <button id="game-clue" type="button" aria-expanded="false" aria-controls="clue">Show Spanish clue · 看西语提示</button>
      <span class="pill" id="combo">🔥 Combo · 连击 0</span>
    </div>
    <p class="feedback" id="clue" lang="es" hidden></p>
    <div class="choices" id="choices" aria-label="Answer choices · 答案选项"></div>
    <p class="feedback" id="game-status" role="status"></p>
    <button id="game-next" type="button" hidden>Next word · 下一个词 →</button>`;
  const all = unit.vocab.map((_, i) => i);
  const pending = all.filter(i => !unitProgress(unit).game.includes(i));
  let queue = shuffle(pending.length ? pending : all);
  let round = 0;
  let combo = 0;
  let locked = false;
  let target = queue[0];

  function setCombo(animate = false) {
    $("combo").textContent = `🔥 Combo · 连击 ${combo}`;
    $("combo").classList.remove("pop");
    if (animate) {
      void $("combo").offsetWidth;
      $("combo").classList.add("pop");
    }
  }

  function displayRound() {
    locked = false;
    target = queue[round];
    $("clue").hidden = true;
    $("game-clue").setAttribute("aria-expanded", "false");
    $("clue").textContent = unit.vocab[target][0];
    $("game-next").hidden = true;
    $("game-status").textContent = `Word ${round + 1}/${queue.length} · 第 ${round + 1} 题`;
    $("choices").replaceChildren();
    const options = shuffle([target, ...shuffle(all.filter(i => i !== target)).slice(0, 3)]);
    for (const index of options) {
      const [, en, zh, icon] = unit.vocab[index];
      const choice = button(`${en} · ${zh}`, () => {
        if (locked) return;
        if (index !== target) {
          combo = 0;
          setCombo();
          choice.classList.remove("shake");
          void choice.offsetWidth;
          choice.classList.add("shake");
          $("game-status").textContent = "🐾 Try one more time. You can listen again! · 再试一次，可以重新听哦！";
          return;
        }
        locked = true;
        combo++;
        setCombo(true);
        const star = earn("game", target, unit);
        choice.classList.add("correct", "pop");
        const done = round === queue.length - 1;
        $("game-status").textContent = done ?
          `🐶 ¡Muy bien! Round complete. · 这一轮完成啦！${star ? " ⭐ +1" : ""}` :
          `🐶 ¡Guau! You got it! · 你答对啦！${star ? " ⭐ +1" : ""}`;
        for (const option of $("choices").children) option.disabled = true;
        $("game-next").textContent = done ? "Play again · 再玩一轮" : "Next word · 下一个词 →";
        $("game-next").hidden = false;
        $("game-next").focus();
      });
      const picture = document.createElement("span");
      picture.className = "icon";
      picture.setAttribute("aria-hidden", "true");
      picture.textContent = icon;
      choice.prepend(picture);
      $("choices").append(choice);
    }
  }

  $("game-listen").onclick = () => {
    if (!speak(unit.vocab[target][0])) {
      $("clue").hidden = false;
      $("game-clue").setAttribute("aria-expanded", "true");
    }
  };
  $("game-clue").onclick = () => {
    $("clue").hidden = !$("clue").hidden;
    $("game-clue").setAttribute("aria-expanded", String(!$("clue").hidden));
  };
  $("game-next").onclick = () => {
    stopSpeech();
    if (round === queue.length - 1) {
      queue = shuffle(all);
      round = 0;
      combo = 0;
      setCombo();
    } else {
      round++;
    }
    displayRound();
    $("game-listen").focus();
  };
  displayRound();
}

// Step 3: tile identity is independent of its text, so repeated tiles work.
function sentenceBuilder(unit) {
  let index = unit.questions.findIndex((_, i) => !unitProgress(unit).builder.includes(i));
  if (index < 0) index = 0;
  lesson.innerHTML = `
    <h2 id="activity-title" tabindex="-1">🧩 Sentence builder · 词块造句</h2>
    <p>Tap tiles in order. Tap a placed tile to undo it. · 按顺序点击词块，点击已放入的词块可以撤回。</p>
    <p id="builder-target"><strong></strong><br><span lang="zh-Hans"></span></p>
    <div id="tray" class="tray row" aria-label="Your sentence · 你的句子"></div>
    <div id="bank" class="bank row" aria-label="Available tiles · 可用词块"></div>
    <div class="row">
      <button type="button" id="check" class="primary">Check · 检查句子</button>
      <button type="button" id="clear-tiles">Clear · 清空词块</button>
      <button type="button" id="say-sentence" hidden>🔊 Hear the sentence · 听完整句</button>
      <button type="button" id="builder-next" hidden>Next sentence · 下一句 →</button>
    </div>
    <p class="feedback" id="builder-status" role="status"></p>`;
  let tiles;
  let selected;
  let solved;

  function paintTiles() {
    $("tray").replaceChildren();
    $("bank").replaceChildren();
    if (!selected.length) $("tray").textContent = "Your tiles go here · 把词块放到这里";
    function tileButton(tile, placed) {
      const control = button(tile.text, () => {
        selected = placed ? selected.filter(item => item !== tile) : [...selected, tile];
        $("builder-status").textContent = "";
        paintTiles();
        const target = placed ? $("bank") : $("tray");
        [...target.children].find(item => item.dataset.tile === String(tile.id))?.focus();
      });
      control.lang = "es";
      control.dataset.tile = tile.id;
      control.disabled = solved;
      if (placed && !solved) control.setAttribute("aria-label", `${tile.text} · Remove tile · 撤回词块`);
      return control;
    }
    for (const tile of selected) $("tray").append(tileButton(tile, true));
    for (const tile of tiles.filter(item => !selected.includes(item))) $("bank").append(tileButton(tile, false));
    $("check").disabled = !selected.length || solved;
    $("clear-tiles").disabled = !selected.length || solved;
  }

  function displayQuestion() {
    const question = unit.questions[index];
    const target = $("builder-target");
    target.querySelector("strong").textContent = `${index + 1}/${unit.questions.length} · ${question.en}`;
    target.querySelector("span").textContent = question.zh;
    const ordered = [...question.answer, ...question.extras].map((text, id) => ({ text, id }));
    tiles = shuffle(ordered);
    if (question.answer.every((_, i) => tiles[i].id === i)) tiles.push(tiles.shift());
    selected = [];
    solved = false;
    $("builder-status").textContent = "";
    $("builder-next").hidden = true;
    $("say-sentence").hidden = true;
    paintTiles();
  }

  $("check").onclick = () => {
    const { answer, tip } = unit.questions[index];
    solved = selected.length === answer.length && selected.every((tile, i) => tile.text === answer[i]);
    if (!solved) {
      $("builder-status").textContent = `🐾 Try moving a tile. · 试着调整词块。 ${tip}`;
      return;
    }
    const star = earn("builder", index, unit);
    $("builder-status").textContent = `🐶 ¡Perfecto! · 拼对啦！${star ? " ⭐ +1" : ""} ${tip}`;
    $("say-sentence").hidden = false;
    $("builder-next").hidden = false;
    $("builder-next").textContent = index === unit.questions.length - 1 ?
      "Back to first sentence · 回到第一句" : "Next sentence · 下一句 →";
    paintTiles();
    $("say-sentence").focus();
  };
  $("clear-tiles").onclick = () => {
    selected = [];
    $("builder-status").textContent = "";
    paintTiles();
    $("bank").firstElementChild?.focus();
  };
  $("say-sentence").onclick = () => speak(unit.questions[index].answer.join(" "));
  $("builder-next").onclick = () => {
    stopSpeech();
    index = (index + 1) % unit.questions.length;
    displayQuestion();
    $("bank").firstElementChild?.focus();
  };
  displayQuestion();
}

// Accept direct video sources and convert supported provider links to embeds.
// An iframe snippet can also be pasted. Only its src is used.
function parseMedia(value) {
  let source = value.trim();
  if (!source) return null;
  if (source.startsWith("<")) {
    const doc = new DOMParser().parseFromString(source, "text/html");
    source = doc.querySelector("iframe[src]")?.getAttribute("src")?.trim() || "";
    if (!source) throw new Error("missing source");
  }
  if (/^javascript:|^data:/i.test(source)) throw new Error("invalid source");
  const url = new URL(source, document.baseURI);
  if (!["https:", "http:", "file:"].includes(url.protocol)) throw new Error("invalid protocol");
  if (url.protocol === "file:" && /^(?:[a-z][a-z\d+.-]*:|\/\/)/i.test(source)) throw new Error("use relative path");
  const host = url.hostname.toLowerCase();
  const parts = url.pathname.split("/").filter(Boolean);
  if (["youtube.com", "www.youtube.com", "m.youtube.com", "youtu.be",
       "youtube-nocookie.com", "www.youtube-nocookie.com"].includes(host)) {
    const id = host === "youtu.be" ? parts[0] :
      ["embed", "shorts", "live"].includes(parts[0]) ? parts[1] : url.searchParams.get("v");
    if (!/^[\w-]{11}$/.test(id || "")) throw new Error("invalid YouTube video");
    return { kind: "embed", src: `https://www.youtube-nocookie.com/embed/${id}` };
  }
  if (["vimeo.com", "www.vimeo.com", "player.vimeo.com"].includes(host)) {
    const id = parts[0] === "video" ? parts[1] : parts[0];
    if (!/^\d+$/.test(id || "")) throw new Error("invalid Vimeo video");
    const hash = url.searchParams.get("h") || (parts[0] === "video" ? "" : parts[1]);
    return { kind: "embed", src: `https://player.vimeo.com/video/${id}${hash ? `?h=${encodeURIComponent(hash)}` : ""}` };
  }
  if (parts.includes("embed") && url.protocol === "https:") return { kind: "embed", src: url.href };
  return { kind: "video", src: url.href };
}

// The default demo and all lyrics work without loading any remote media.
function songs(unit) {
  lesson.innerHTML = `

  function showDemo() {
    player.replaceChildren();
    player.hidden = true;
    demo.hidden = false;
    $("media-status").textContent = "";
  }

  function loadVideo() {
    showDemo();
    let media;
    try { media = parseMedia(input.value); }
    catch {
      $("media-status").textContent = "Try a video file path or a supported embed link. · 请试试视频文件路径或可用的嵌入链接。";
      return;
    }
    if (!media) return;
    const element = document.createElement(media.kind === "video" ? "video" : "iframe");
    if (media.kind === "video") {
      element.controls = true;
      element.playsInline = true;
      element.preload = "metadata";
      element.onerror = () => {

        showDemo();
        $("media-status").textContent = "The video couldn’t open. Check the path or try another file. · 视频暂无法打开，请检查路径或换一个文件。";
      };
    } else {
      element.title = unit.song.title;
      element.allowFullscreen = true;
      element.referrerPolicy = "strict-origin-when-cross-origin";
      element.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation");
      $("media-status").textContent = "Online players need internet and embedding permission. · 在线播放器需要联网，并且视频需允许嵌入。";
    }
    player.append(element);
    player.hidden = false;
    demo.hidden = true;
    element.src = media.src;
  }

  $("load-video").onclick = loadVideo;
  input.onkeydown = event => { if (event.key === "Enter") loadVideo(); };
  $("demo-video").onclick = showDemo;
  for (const [index, [es, en, zh]] of unit.song.lines.entries()) {
    const item = document.createElement("li");
    const line = button("", () => speak(es, () => {
      if (earn("listened", index, unit) && item.isConnected) {
        $("media-status").textContent = "⭐ +1 Echo star · 跟读星星 +1";
      }
    }));
    const lyric = document.createElement("span");
    lyric.lang = "es";
    lyric.textContent = es;
    const translation = document.createElement("small");
    translation.textContent = `${en} · ${zh}`;
    line.append("🔊 ", lyric, translation);
    item.append(line);
    $("lyrics").append(item);
  }

}

      <a class="download" id="download" hidden>⬇ Download recording · 下载录好的视频</a>
    </div>
    <details open>
      <summary id="recording-count"></summary>
      <ol id="recordings"></ol>
    </details>`;

  $("studio-script").textContent = unit.script;
  $("clip-title").value = unit.challenge;
  const preview = $("camera");
  const playback = $("playback");
  const status = $("studio-status");
  const recordButton = $("record");
  const stopButton = $("stop-record");
  const openButton = $("open-camera");
  const closeButton = $("close-camera");
  const download = $("download");
  let alive = true;
  let opening = false;
  let stream = null;
  let recorder = null;
  let localUrl = "";
  let finalizing = false;

  function controls() {
    openButton.disabled = Boolean(opening || stream || finalizing);
    recordButton.disabled = !stream || Boolean(recorder) || finalizing;
    stopButton.disabled = recorder?.state !== "recording";
    closeButton.disabled = !stream || Boolean(recorder) || finalizing;
    $("clip-title").disabled = Boolean(recorder) || finalizing;
  }

  function closeCamera() {
    stream?.getTracks().forEach(track => track.stop());
    stream = null;
    preview.srcObject = null;
    $("camera-frame").hidden = true;
    controls();
  }

  function showClip(url, title) {
    playback.src = url;
    $("playback-title").textContent = title;
    $("playback-frame").hidden = false;
  }

  function clearLocalUrl() {
    if (!localUrl) return;
    URL.revokeObjectURL(localUrl);
    localUrl = "";
  }

  function latestClip(playNow = false) {
    if (!latestRecording) return;
    download.href = latestRecording.url;
    download.download = latestRecording.filename;
    download.hidden = false;
    $("replay-latest").hidden = false;
    if (playNow) {
      showClip(latestRecording.url, latestRecording.title);
      clearLocalUrl();
    }
  }

  function renderRecordings() {
    $("recording-count").textContent = `🎥 ${passport.recordings.length} recordings · 已拍摄打卡`;
    const list = $("recordings");
    list.replaceChildren();
    for (const entry of [...passport.recordings].reverse()) {
      const item = document.createElement("li");
      const day = new Intl.DateTimeFormat("en-GB", { dateStyle: "medium" }).format(new Date(entry.date));
      item.textContent = `${entry.title} · ${day}`;
      list.append(item);
    }
  }

  openButton.onclick = async () => {
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      status.textContent = "Camera recording isn’t available here. Pick or drop a saved clip below. · 当前环境无法录制，可在下方选择或拖入已保存的视频。";
      return;
    }
    opening = true;
    controls();
    status.textContent = "Waiting for camera permission… · 等待摄像头和麦克风授权……";
    try {
      const media = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      if (!alive) {
        media.getTracks().forEach(track => track.stop());
        return;
      }
      stream = media;
      preview.srcObject = media;
      $("camera-frame").hidden = false;
      preview.play().catch(() => {});
      status.textContent = "Camera is ready! · 摄像头准备好啦！";
    } catch {
      if (alive) status.textContent =
        "Camera or microphone unavailable. Check browser permissions or pick a saved clip below. · 摄像头或麦克风暂不可用，可检查浏览器权限，或在下方选择已录视频。";
    } finally {
      opening = false;
      if (alive) controls();
    }
  };

  closeButton.onclick = () => {
    closeCamera();
    status.textContent = "Camera closed. · 摄像头已关闭。";
  };

  recordButton.onclick = () => {
    if (!stream || recorder || finalizing) return;
    const title = $("clip-title").value.trim() || unit.challenge;
    const chunks = [];
    let failed = false;
    try {
      const formats = ["video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
      const format = formats.find(type => MediaRecorder.isTypeSupported?.(type));
      const active = format ? new MediaRecorder(stream, { mimeType: format }) : new MediaRecorder(stream);
      recorder = active;
      active.ondataavailable = event => {
        if (alive && event.data.size) chunks.push(event.data);
      };
      active.onerror = () => {
        failed = true;
        if (!alive) return;
        recorder = null;
        finalizing = false;
        closeCamera();
        status.textContent = "Recording paused by the browser. Open the camera to try again. · 浏览器中断了录制，可以重新开启摄像头再试。";
      };
      active.onstop = () => {
        if (!alive || failed) return;
        recorder = null;
        finalizing = false;
        closeCamera();
        const type = active.mimeType || chunks[0]?.type || "";
        const clip = new Blob(chunks, { type });
        if (!clip.size) {
          status.textContent = "No video was captured. Try recording a little longer. · 这次没有录到视频，可以试着多录几秒。";
          return;
        }
        const previous = latestRecording;
        const extension = type.includes("mp4") ? "mp4" : type.includes("ogg") ? "ogv" : "webm";
        latestRecording = {
          title,
          url: URL.createObjectURL(clip),
          filename: `${title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, "_")}.${extension}`
        };
        latestClip(true);
        if (previous) URL.revokeObjectURL(previous.url);
        passport.recordings.push({ title, unit: unit.id, date: new Date().toISOString() });
        save();
        renderRecordings();
        status.textContent = "⭐ +1 Recorded! Watch it now or download it to keep. · 录好啦！现在就能回看，下载后可长期保存。";
        playback.play().catch(() => {});
      };
      active.start();
      controls();
      status.textContent = "🔴 Recording… Say your Spanish lines! · 正在录制，来说西语吧！";
    } catch {
      recorder = null;
      controls();
      status.textContent = "Recording couldn’t start. You can still open a saved clip below. · 暂时无法开始录制，可以在下方打开已保存的视频。";
    }
  };

  stopButton.onclick = () => {
    if (recorder?.state !== "recording") return;
    finalizing = true;
    recorder.stop();
    controls();
    status.textContent = "Preparing your video… · 正在准备回放……";
  };

  function playFile(file) {
    if (!file) return;
    if (!file.type.startsWith("video/") && !/\.(mp4|webm|mov|m4v|ogv|ogg|mkv|avi|mpeg)$/i.test(file.name)) {
      status.textContent = "Choose a video file. · 请选择一个视频文件。";
      return;
    }
    const previous = localUrl;
    localUrl = URL.createObjectURL(file);
    showClip(localUrl, file.name);
    if (previous) URL.revokeObjectURL(previous);
    status.textContent = "Your clip is ready to play. · 可以回看你的视频啦。";
    playback.play().catch(() => {});
  }

  playback.onerror = () => {
    if (alive) status.textContent = "This browser couldn’t play the clip. Try an MP4 or WebM video. · 此浏览器无法播放该视频，可试试 MP4 或 WebM。";
  };
  $("local-video").onchange = event => {
    playFile(event.target.files[0]);
    event.target.value = "";
  };
  const drop = $("drop");
  drop.ondragover = event => { event.preventDefault(); drop.classList.add("drag"); };
  drop.ondragleave = () => drop.classList.remove("drag");
  drop.ondrop = event => {
    event.preventDefault();
    drop.classList.remove("drag");
    playFile(event.dataTransfer.files[0]);
  };
  $("replay-latest").onclick = () => {
    latestClip(true);
    playback.play().catch(() => {});
  };
  const endWithNotice = () => {
    if (recorder || finalizing) return "The camera is recording. · 摄像头正在录制。";
    return "";
  };
  studioBusy = endWithNotice;
  latestClip(Boolean(latestRecording));
  controls();
  renderRecordings();

  disposePanel = () => {
    alive = false;
    studioBusy = () => "";
    if (recorder?.state === "recording") recorder.stop();
    closeCamera();
    playback.pause();
    playback.removeAttribute("src");
    playback.load();
    clearLocalUrl();
  };
}

// Finish an active recording before leaving the studio through the app.
let studioBusy = () => "";

function canNavigate() {
  if (!studioBusy()) return true;
  $("studio-status").textContent =
